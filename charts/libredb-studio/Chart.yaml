apiVersion: v2
name: libredb-studio
description: Web-based SQL IDE for cloud-native teams supporting PostgreSQL, MySQL, SQLite, Oracle, SQL Server, MongoDB, and Redis
type: application
version: 0.1.31
appVersion: "0.10.0"
kubeVersion: ">=1.26.0-0"
home: https://github.com/libredb/libredb-studio
icon: https://raw.githubusercontent.com/libredb/libredb-studio/main/public/logo.svg
sources:
  - https://github.com/libredb/libredb-studio
keywords:
  - sql
  - ide
  - database
  - postgresql
  - mysql
  - mongodb
  - redis
  - sqlite
  - oracle
  - mssql
  - web-ide
maintainers:
  - name: cevheri
    url: https://github.com/cevheri
annotations:
  artifacthub.io/category: database
  artifacthub.io/license: MIT
  artifacthub.io/prerelease: "false"
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/images: |
    - name: libredb-studio
      image: ghcr.io/libredb/libredb-studio:0.10.0
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/libredb/libredb-studio#readme
    - name: Container Image
      url: https://github.com/libredb/libredb-studio/pkgs/container/libredb-studio
    - name: Source
      url: https://github.com/libredb/libredb-studio
  artifacthub.io/changes: |
    - "Security release. This is the first published version carrying a four-phase security programme; every item below is new to a released artefact"
    - "Security headers on every response, including an ENFORCED Content-Security-Policy, HSTS, Referrer-Policy, Permissions-Policy and frame-ancestors"
    - "State-changing requests are checked against Origin, as a second cross-site-request-forgery layer behind SameSite=lax cookies"
    - "Login, database and AI routes are rate limited; login failures are capped per client address and per submitted account, counted per process"
    - "Every authentication transition emits one structured JSON audit line on stdout under the libredb.audit.v1 schema"
    - "Stored database credentials are encrypted at rest with AES-256-GCM when STORAGE_PROVIDER is sqlite or postgres. Set STORAGE_ENCRYPTION_KEY from outside the mounted volume to protect a backup or snapshot as well as the database file"
    - "Two cross-site-scripting sinks and an unauthenticated image proxy were removed, and the production build now type-checks"
    - "ACTION MAY BE REQUIRED. An ingress that rewrites Host without setting x-forwarded-host must set ALLOWED_ORIGINS to this deployment public origin, or every state-changing request is refused with 403"
    - "Track app release 0.10.0 (appVersion bump; default image tag follows)"
dependencies:
  - name: postgresql
    version: "16.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
