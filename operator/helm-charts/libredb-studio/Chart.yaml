apiVersion: v2
name: libredb-studio
description: Web-based SQL IDE for cloud-native teams supporting fourteen engines - PostgreSQL, MySQL, SQLite, Oracle, SQL Server, MongoDB, Redis, Couchbase, ClickHouse, Apache Druid, Elasticsearch, OpenSearch, Apache Trino and Apache Cassandra
type: application
version: 0.1.47
appVersion: "0.13.3"
kubeVersion: ">=1.26.0-0"
home: https://github.com/libredb/libredb-studio
icon: https://raw.githubusercontent.com/libredb/libredb-studio/main/public/logo.svg
sources:
  - https://github.com/libredb/libredb-studio
keywords:
  - sql
  - ide
  - database
  - postgresql
  - mysql
  - mongodb
  - redis
  - sqlite
  - oracle
  - mssql
  - couchbase
  - clickhouse
  - druid
  - elasticsearch
  - opensearch
  - trino
  # ArtifactHub search matches on keywords, so an engine absent here is an engine
  # nobody finds. Added in 0.1.45, one chart version after Apache Cassandra
  # shipped in 0.12.0 (#448) - #167 makes a keyword-only fix cost a chart version
  # of its own, so a new engine's keyword belongs in the release that ships it.
  - cassandra
  - web-ide
maintainers:
  - name: cevheri
    url: https://github.com/cevheri
annotations:
  artifacthub.io/category: database
  artifacthub.io/license: MIT
  artifacthub.io/prerelease: "false"
  # False: 0.13.3 changes no dependency and no security behaviour. Its whole
  # content is a file mode inside the Linux desktop AppImage, which reaches
  # neither the chart nor the image this chart deploys. The app-level security
  # fixes remain recorded on 0.1.37, the chart version that first shipped them;
  # the adm-zip pin note belongs to 0.1.44 and is unchanged.
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/images: |
    - name: libredb-studio
      image: ghcr.io/libredb/libredb-studio:0.13.3
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/libredb/libredb-studio#readme
    - name: Container Image
      url: https://github.com/libredb/libredb-studio/pkgs/container/libredb-studio
    - name: Source
      url: https://github.com/libredb/libredb-studio
  artifacthub.io/changes: |
    - "The Linux desktop AppImage shipped a launcher only its builder could execute: linuxdeploy writes AppRun.wrapped as 0770 root:root, so anything reading the image with real permission checks - an extracted AppDir owned by another uid, a non-root container, or firejail's --appimage mount - died with Permission denied and never opened a window"
    - "A private FUSE mount skips that check, which is why the ordinary double-click always worked and no gate ever saw it. The build now audits the bundled file modes and repacks the image, reusing the original runtime bytes so the change cannot alter whether the image mounts at all"
    - "Chart 0.1.47 changes no template: its content is the appVersion move to 0.13.3"
    - "Track app release 0.13.3 (appVersion bump; default image tag follows)"
dependencies:
  - name: postgresql
    version: "16.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
