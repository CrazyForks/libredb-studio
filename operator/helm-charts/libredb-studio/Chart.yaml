apiVersion: v2
name: libredb-studio
description: Web-based SQL IDE for cloud-native teams supporting PostgreSQL, MySQL, SQLite, Oracle, SQL Server, MongoDB, and Redis
type: application
version: 0.1.32
appVersion: "0.11.0"
kubeVersion: ">=1.26.0-0"
home: https://github.com/libredb/libredb-studio
icon: https://raw.githubusercontent.com/libredb/libredb-studio/main/public/logo.svg
sources:
  - https://github.com/libredb/libredb-studio
keywords:
  - sql
  - ide
  - database
  - postgresql
  - mysql
  - mongodb
  - redis
  - sqlite
  - oracle
  - mssql
  - web-ide
maintainers:
  - name: cevheri
    url: https://github.com/cevheri
annotations:
  artifacthub.io/category: database
  artifacthub.io/license: MIT
  artifacthub.io/prerelease: "false"
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/images: |
    - name: libredb-studio
      image: ghcr.io/libredb/libredb-studio:0.11.0
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/libredb/libredb-studio#readme
    - name: Container Image
      url: https://github.com/libredb/libredb-studio/pkgs/container/libredb-studio
    - name: Source
      url: https://github.com/libredb/libredb-studio
  artifacthub.io/changes: |
    - "Runtime baseline raised to Node 24 LTS. This is a breaking change for the npm package and the standalone tarballs only. The container image this chart deploys already ran Node 24, so a Helm upgrade needs no action and no values change"
    - "Node 26 is now fully supported, server-side SQLite storage included. better-sqlite3 moved to its N-API line, so one prebuilt binary stays valid across Node majors instead of being pinned to the ABI that built it"
    - "Security: lodash advanced to 4.18.1, clearing CVE-2026-4800 (arbitrary code execution via untrusted input in template imports). It enters the bundle only through recharts and no Studio code path reaches the affected template import, but the version an image scanner reports now carries the fix"
    - "Dependency refresh across roughly fifty packages inside their existing ranges, including React, the Radix set, pg, mysql2, mongodb, openid-client and zod"
    - "Track app release 0.11.0 (appVersion bump; default image tag follows)"
dependencies:
  - name: postgresql
    version: "16.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
