apiVersion: v2
name: libredb-studio
description: Web-based SQL IDE for cloud-native teams supporting fourteen engines - PostgreSQL, MySQL, SQLite, Oracle, SQL Server, MongoDB, Redis, Couchbase, ClickHouse, Apache Druid, Elasticsearch, OpenSearch, Apache Trino and Apache Cassandra
type: application
version: 0.1.47
appVersion: "0.13.3"
kubeVersion: ">=1.26.0-0"
home: https://github.com/libredb/libredb-studio
icon: https://raw.githubusercontent.com/libredb/libredb-studio/main/public/logo.svg
sources:
  - https://github.com/libredb/libredb-studio
keywords:
  - sql
  - ide
  - database
  - postgresql
  - mysql
  - mongodb
  - redis
  - sqlite
  - oracle
  - mssql
  - couchbase
  - clickhouse
  - druid
  - elasticsearch
  - opensearch
  - trino
  # ArtifactHub search matches on keywords, so an engine absent here is an engine
  # nobody finds. Added in 0.1.45, one chart version after Apache Cassandra
  # shipped in 0.12.0 (#448) - #167 makes a keyword-only fix cost a chart version
  # of its own, so a new engine's keyword belongs in the release that ships it.
  - cassandra
  - web-ide
maintainers:
  - name: cevheri
    url: https://github.com/cevheri
annotations:
  artifacthub.io/category: database
  artifacthub.io/license: MIT
  artifacthub.io/prerelease: "false"
  # True, and narrowly: no dependency moved and no CVE is involved, but a pasted
  # rediss:// or couchbases:// URL landed on SSL mode `disable`, so a connection
  # the user asked to encrypt was made in the clear - and the Couchbase transport
  # was posting plain HTTP to the TLS management port. An operator deciding whether
  # to upgrade should see that, which is what this flag is for. The app-level
  # security fixes of earlier releases remain recorded on 0.1.37, the chart version
  # that first shipped them; the adm-zip pin note belongs to 0.1.44, unchanged.
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/images: |
    - name: libredb-studio
      image: ghcr.io/libredb/libredb-studio:0.13.3
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/libredb/libredb-studio#readme
    - name: Container Image
      url: https://github.com/libredb/libredb-studio/pkgs/container/libredb-studio
    - name: Source
      url: https://github.com/libredb/libredb-studio
  artifacthub.io/changes: |
    - "Every MySQL DDL and DML statement reported a failure for work the server had already applied: the driver returns an object rather than a row array for anything that returns no rows, so CREATE TABLE, INSERT, UPDATE and DELETE all answered with a TypeError while the change was committed. A SQL IDE reporting an error for a statement that ran is the worst available answer, because the user retries it"
    - "A cache hit ratio was fabricated in eight providers rather than measured: SQLite claimed a fixed 95%, Couchbase published 0% when the stats read was denied (the ordinary case there, and 0 rates as critical), and Postgres, Oracle and SQL Server defaulted to 100 or 0 inside our own SQL. Absent metrics now read as not measured, and buffer pool usage stopped being the same quantity drawn twice"
    - "MySQL lost its whole health panel, not one metric, on a tenant with no performance_schema database, because the ratio query ran uncaught"
    - "A result exported as DDL typed numeric and timestamp columns as TEXT, and a binary value was written as its JSON shape - 46 bytes of JSON text where six bytes belonged. Postgres, MySQL, Oracle and SQL Server now report the engine's own column types, and every dialect writes a binary literal its own engine accepts, verified by replaying the export into seven engines"
    - "A pasted rediss:// or couchbases:// URL landed on SSL mode disable, so the scheme was silently dropped - and the Couchbase transport was posting plain HTTP to the TLS management port"
    - "The Linux desktop AppImage shipped a launcher only its builder could execute: linuxdeploy writes AppRun.wrapped as 0770 root:root, so anything reading the image with real permission checks - an extracted AppDir owned by another uid, a non-root container, or firejail's --appimage mount - died with Permission denied and never opened a window. A private FUSE mount skips that check, which is why the ordinary double-click always worked and no gate ever saw it"
    - "Chart 0.1.47 changes no template: its content is the appVersion move to 0.13.3"
    - "Track app release 0.13.3 (appVersion bump; default image tag follows)"
dependencies:
  - name: postgresql
    version: "16.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
